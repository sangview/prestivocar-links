<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prestivo Cars · Liens</title>
  <meta name="description" content="Prestivo Cars — retrouvez-nous sur TikTok, Facebook et contactez-nous directement sur WhatsApp.">
  <meta name="theme-color" content="#323542">
  <link rel="canonical" href="https://links.prestivocar.com/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Aperçu quand le lien est partagé (WhatsApp, Instagram, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://links.prestivocar.com/">
  <meta property="og:title" content="Prestivo Cars">
  <meta property="og:description" content="Nos véhicules, nos réseaux et une réservation directe sur WhatsApp.">
  <meta property="og:image" content="https://links.prestivocar.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #323542;
      --card: #3F414C;
      --card-hover: #484952;
      --ink: #FDFBF9;
      --muted: #B0B0B4;
      --accent: #D9BF9F;
      --accent-light: #EADCCB;
      --accent-deep: #C8A273;
      --line: rgba(217, 191, 159, 0.28);
      --glow: rgba(217, 191, 159, 0.55);
      --glow-soft: rgba(217, 191, 159, 0.15);
      --accent-grad: linear-gradient(135deg, #EADCCB 0%, #D9BF9F 45%, #C8A273 100%);
      --on-accent: #1A1713;
      --on-accent-muted: rgba(26, 23, 19, 0.72);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { background: var(--bg); }
    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Jost", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    #sparkles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    main { position: relative; z-index: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

    /* --- En-tête --- */
    .logo {
      width: min(250px, 68vw); height: auto; aspect-ratio: 1;
      display: block; margin: -10px 0 2px;
      /* fond du logo fondu dans la page */
      -webkit-mask-image: radial-gradient(circle, #000 67%, transparent 76%);
              mask-image: radial-gradient(circle, #000 67%, transparent 76%);
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .tagline {
      margin: 0; color: var(--muted); font-size: 15px; text-align: center;
      line-height: 1.5; max-width: 34ch;
    }
    .divider {
      display: flex; align-items: center; gap: 12px; color: var(--accent);
      margin: 24px 0 22px; width: 60%; font-size: 12px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
    .divider::after { transform: scaleX(-1); }

    /* --- Boutons --- */
    .links { list-style: none; padding: 0; margin: 0; width: 100%; display: grid; gap: 12px; }
    .btn {
      display: flex; align-items: center; gap: 14px;
      min-height: 62px; padding: 12px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink); text-decoration: none;
      font-size: 16px; font-weight: 500; letter-spacing: .02em;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover {
      transform: translateY(-2px); background: var(--card-hover); border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--glow-soft), 0 12px 30px -16px var(--glow);
    }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 3px; }
    .btn .ico { width: 24px; height: 24px; flex: none; color: var(--accent); }
    .btn .label { flex: 1; }
    .btn .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 1px; letter-spacing: .01em; }
    .btn .arrow { width: 18px; height: 18px; color: var(--line); flex: none; transition: color .18s, transform .18s; }
    .btn:hover .arrow { color: var(--accent); transform: translateX(2px); }

    /* Bouton principal (WhatsApp) : couleur de la marque, pleine */
    .btn.primary { background: var(--accent-grad); border-color: transparent; color: var(--on-accent); }
    .btn.primary .ico, .btn.primary .arrow { color: var(--on-accent); }
    .btn.primary .sub { color: var(--on-accent-muted); }
    .btn.primary:hover { background: var(--accent-grad); filter: brightness(1.06); border-color: transparent; box-shadow: 0 14px 34px -14px var(--glow); }

    @media (prefers-reduced-motion: reduce) { .btn, .btn .arrow { transition: none; } }
  </style>
</head>
<body>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <main>
    <img class="logo" src="logo.jpg" alt="Prestivo Cars" width="560" height="560">
    <h1 class="sr-only" id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="divider" aria-hidden="true">✦</div>

    <ul class="links" id="links"></ul>
  </main>

  <script>
    /* Paillettes discrètes (figées si l'utilisateur limite les animations) */
    (() => {
      const c = document.getElementById("sparkles"), ctx = c.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let W, H, dots = [];
      const resize = () => {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dots = Array.from({ length: Math.round(W * H / 9000) }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.3 + .3, a: Math.random() * .5 + .1,
          s: Math.random() * .015 + .004, p: Math.random() * Math.PI * 2,
        }));
      };
      const draw = t => {
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          ctx.globalAlpha = d.a * (still ? 1 : .55 + .45 * Math.sin(d.p + t * d.s * .06));
          ctx.fillStyle = "#D9BF9F";
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!still) requestAnimationFrame(draw);
      };
      addEventListener("resize", () => { resize(); if (still) draw(0); });
      resize(); requestAnimationFrame(draw);
    })();
  </script>

  <script>
    /* =====================================================================
       ✏️  À MODIFIER — tout se règle ici
       ===================================================================== */
    const PROFILE = {
      name: "Prestivo Cars",
      tagline: "Location de véhicules de prestige — l'élégance au volant, sans compromis.",

      whatsapp: {
        // Numéro au format international, chiffres uniquement (ex. 06 12 34 56 78 → "33612345678")
        number: "22372415539",
        // Message déjà écrit quand la personne ouvre la conversation
        message: "Bonjour Prestivo Cars, je souhaiterais réserver un véhicule.",
        label: "Réserver sur WhatsApp",
        sub: "Disponibilités et tarifs en direct",
      },

      // Un réseau par ligne : supprimez une ligne pour le masquer, changez l'ordre librement.
      // Icônes : instagram tiktok facebook pinterest youtube linkedin snapchat x threads phone mail map calendar star shop globe
      links: [
        { icon: "mobile", label: "Application web", sub: "Réserver depuis votre téléphone", url: "https://prestivocar.com/", top: true },
        { icon: "tiktok", label: "TikTok", sub: "@prestivo3", url: "https://www.tiktok.com/@prestivo3" },
        { icon: "facebook", label: "Facebook", sub: "Prestivo Cars", url: "https://www.facebook.com/people/Prestivo-Cars/61570318172419/" },
      ],
    };
    /* ===================================================================== */

    const ICONS = {
      whatsapp: '<path d="M3.5 20.5l1.3-4.3A8.5 8.5 0 1 1 8 19.4z"/><path d="M9.2 8.3c-.3 3.2 3.3 6.8 6.5 6.5l.9-1.4-2-1.1-.9.7c-1-.4-2-1.4-2.4-2.4l.7-.9-1.1-2z" fill="currentColor" stroke="none"/>',
      instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/>',
      tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.7 2.3 4.5 5 4.7"/>',
      facebook: '<path d="M14.5 21v-7.5h2.7l.4-3.1h-3.1V8.6c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.1H9v3.1h2.5V21"/>',
      pinterest: '<circle cx="12" cy="12" r="9"/><path d="M11 13.2 9.4 20"/><path d="M8.6 12.6c-.8-3.2 1.4-5.8 4.3-5.8 2.6 0 4 1.8 4 3.9 0 2.6-1.4 4.6-3.3 4.6-1.4 0-2.3-1.1-2-2.4l.6-2.5"/>',
      youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>',
      linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.2v.1M12 17v-3.8a2.2 2.2 0 0 1 4.4 0V17M12 10.5V17"/>',
      snapchat: '<path d="M12 3.5c2.9 0 4.8 2.1 4.8 4.9v2.1l1.7.6-1.2 1.2c.6 1.4 1.7 2.4 2.9 2.8-.9.7-2 .8-2.8 1-.3.8-.7 1.4-1.4 1.4-.9 0-1.9-.7-4-.7s-3.1.7-4 .7c-.7 0-1.1-.6-1.4-1.4-.8-.2-1.9-.3-2.8-1 1.2-.4 2.3-1.4 2.9-2.8L5.5 11.1l1.7-.6V8.4c0-2.8 1.9-4.9 4.8-4.9z"/>',
      x: '<path d="M4 4h4.5L20 20h-4.5z"/><path d="M20 4l-6.6 7.3M4 20l6.6-7.3"/>',
      threads: '<path d="M16.4 11.3c-.4-2.5-2.2-3.8-4.4-3.8-2.6 0-4.2 1.9-4.2 4.5s1.6 4.5 4.2 4.5c2 0 3.6-1.2 3.6-3 0-2.5-3.5-3-5.2-1.8"/><path d="M12 21c5.2 0 8-3.4 8-9s-2.8-9-8-9-8 3.4-8 9 2.8 9 8 9z"/>',
      mobile: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
      phone: '<path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
      mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/>',
      map: '<path d="M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
      star: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
      shop: '<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
    };
    const svg = (name, cls) =>
      `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.globe}</svg>`;
    const arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function item({ icon, label, sub, url }, primary = false) {
      const ext = !/^(mailto|tel):/.test(url);
      return `<li><a class="btn${primary ? " primary" : ""}" href="${esc(url)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
        ${svg(icon, "ico")}
        <span class="label">${esc(label)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span>
        ${arrow}
      </a></li>`;
    }

    document.getElementById("name").textContent = PROFILE.name;
    document.getElementById("tagline").textContent = PROFILE.tagline;

    const wa = PROFILE.whatsapp;
    const waItem = wa && wa.number
      ? item({ icon: "whatsapp", label: wa.label, sub: wa.sub,
               url: `https://wa.me/${wa.number.replace(/\D/g, "")}?text=${encodeURIComponent(wa.message)}` }, true)
      : "";

    // top: true → bouton affiché au-dessus de WhatsApp
    document.getElementById("links").innerHTML =
      PROFILE.links.filter(l => l.top).map(l => item(l)).join("") + waItem +
      PROFILE.links.filter(l => !l.top).map(l => item(l)).join("");
  </script>
</body>
</html>
